<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grasshopper Sandbox - Modular</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Externe CSS Datei -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="gh-canvas text-slate-100 h-screen overflow-hidden flex flex-col font-mono select-none">

   <!-- Top Toolbar -->
<header class="bg-zinc-900/90 backdrop-blur border-b border-zinc-800 px-4 py-3 flex items-center justify-between overflow-x-auto flex-nowrap shrink-0 gap-4">
    <div class="flex items-center gap-4 shrink-0">
        <h1 class="text-sm font-bold text-amber-500 tracking-wider">RHINO // MODULAR CANVAS</h1>
        <span class="text-xs text-zinc-500">|</span>
        <span class="text-xs text-zinc-400">Aktive Kabel: <strong id="connectionCount" class="text-white">0</strong></span>
    </div>

    <div class="flex items-center gap-2 shrink-0">
        <!-- Zoom Controls -->
        <button onclick="zoomOut()" class="px-2 py-1 bg-zinc-800 text-white rounded text-xs hover:bg-zinc-700">-</button>
        <span id="zoomLevel" class="text-xs text-zinc-300 min-w-[36px] text-center">100%</span>
        <button onclick="zoomIn()" class="px-2 py-1 bg-zinc-800 text-white rounded text-xs hover:bg-zinc-700">+</button>

        <select id="componentSelect" class="bg-zinc-950 border border-zinc-700 text-xs text-zinc-200 px-2.5 py-1.5 rounded focus:outline-none focus:border-amber-500">
            <option value="" disabled selected>+ Komponente hinzufügen...</option>
        </select>
        <button id="addBtn" class="bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold px-3 py-1.5 rounded text-xs transition">
            Platzieren
        </button>
        <button id="clearBtn" class="bg-zinc-800 hover:bg-rose-900/50 hover:text-rose-200 text-zinc-300 font-semibold px-3 py-1.5 rounded text-xs transition">
            Reset
        </button>
    </div>
</header>

   <!-- In deiner Kopfzeile / Toolbar (z.B. neben dem Reset-Button): -->
    <div class="flex items-center gap-2">
        <button onclick="zoomOut()" class="px-2 py-1 bg-zinc-700 text-white rounded text-xs">-</button>
        <span id="zoomLevel" class="text-xs text-zinc-300">100%</span>
        <button onclick="zoomIn()" class="px-2 py-1 bg-zinc-700 text-white rounded text-xs">+</button>
    </div>

    <!-- Der Haupt-Workspace und der Skalierungs-Container: -->
    <main id="canvasWorkspace" class="flex-1 relative overflow-auto w-full h-[100dvh] bg-[#e5e5e5]">
        <div id="canvasInner" class="relative w-[3000px] h-[3000px] origin-top-left transition-transform duration-75">
            <!-- Das SVG für Kabel -->
            <svg id="wireCanvas" class="absolute top-0 left-0 w-full h-full pointer-events-none">
                <g id="wiresGroup"></g>
            </svg>
            
            <!-- Container für deine platzierten Bausteine -->
            <div id="nodesContainer" class="absolute top-0 left-0 w-full h-full"></div>
        </div>
    </main>

        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-zinc-600 z-0">
            <p class="text-sm tracking-widest uppercase">Canvas ist leer</p>
            <p class="text-xs mt-1">Modular aufgeteilt – bereit für deine Erweiterungen.</p>
        </div>
    </main>

    <!-- Externe JavaScript Datei -->
    <script src="app.js?v=4.0"></script>
</body>
</html>
